name: Agent Report model experiment
on:
  push:
    branches: [agent-report-model-experiment]
    paths:
      - 'experiments/agent-report/**'
      - '.github/workflows/agent-report-model-experiment.yml'
permissions:
  contents: read
concurrency:
  group: agent-report-model-experiment
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate experiment and cost estimate
        run: python experiments/agent-report/run.py --dry-run
      - name: Run authorized comparison
        if: false # Completed experiment; paid execution intentionally disabled.
        env:
          OPENAI_API_KEY: ${{ secrets.AGENT_REPORT_OPENAI_API_KEY }}
        run: python experiments/agent-report/run.py --resume
      - name: Retain experiment results
        if: always() && hashFiles('experiments/agent-report/results/**') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent-report-model-comparison
          path: experiments/agent-report/results/
          retention-days: 14
          if-no-files-found: ignore
