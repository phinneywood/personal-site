name: Agent Report checks
on:
  push:
    branches: [main, agent-report-build]
    paths: ['src/**', 'scripts/agent-report/**', 'agent-report/bootstrap.json', 'tests/**', 'package*.json', 'vercel.json', '.github/workflows/agent-report-checks.yml']
  pull_request:
    paths: ['src/**', 'scripts/agent-report/**', 'agent-report/**', 'tests/**', 'package*.json', 'vercel.json']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install -r scripts/agent-report/requirements.txt
      - run: python -m unittest discover -s scripts/agent-report -p 'test_*.py'
      - run: npm test
      - run: npm run build
      - name: Install browser verification
        run: |
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Verify rendered desktop and mobile page
        run: |
          test ! -e dist/agent-report/current.json
          cp agent-report/bootstrap.json dist/agent-report/current.json
          python -m http.server 4173 --directory dist > /tmp/agent-report-static.log 2>&1 &
          python scripts/agent-report/browser_verify.py
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent-report-browser
          path: .agent-report-browser/
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Verify public deployment
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/agent-report/browser_verify.py --url https://antonioskilton.com/agent-report --live --output .agent-report-public
      - name: Retain public browser evidence
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent-report-public
          path: .agent-report-public/
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: ignore
