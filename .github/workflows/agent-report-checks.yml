name: Agent Report checks
on:
  push:
    branches: [main, agent-report-build]
    paths: ['src/**', 'scripts/agent-report/**', 'agent-report/bootstrap.json', 'tests/**', 'package*.json', 'vercel.json', '.github/workflows/agent-report-checks.yml']
  pull_request:
    paths: ['src/**', 'scripts/agent-report/**', 'agent-report/**', 'tests/**', 'package*.json', 'vercel.json']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install -r scripts/agent-report/requirements.txt
      - run: python -m unittest discover -s scripts/agent-report -p 'test_*.py'
      - run: npm test
      - run: npm run build
